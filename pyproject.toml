[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcr"
version = "0.1.0"
description = "Conformance-aware repair for HTN planning domains"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
tcr = "tcr.cli:main"
tcr-headline = "tcr.experiments.run_headline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
